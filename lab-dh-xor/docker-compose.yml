services:
  bob:
    image: python:3.11-slim
    container_name: bob
    hostname: bob
    working_dir: /app
    volumes:
      - ./scripts:/app
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    networks:
      red-cripto:
        ipv4_address: 172.28.0.10
  alice:
    image: python:3.11-slim
    container_name: alice
    hostname: alice
    working_dir: /app
    volumes:
      - ./scripts:/app
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    networks:
      red-cripto:
        ipv4_address: 172.28.0.20
networks:
  red-cripto:
    name: red-cripto
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
